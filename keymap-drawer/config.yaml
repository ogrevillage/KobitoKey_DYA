parse_config:
  raw_binding_map:
    # Existing
    '&sys_reset': Reset
    '&bootloader': Boot
    '&caps_word': Caps Word

    # JIS Shift combinations
    '&kp LS(MINUS)': "="

    '&kp LS(NUMBER_8)': "("
    '&kp LS(N8)': "("

    '&kp LS(NUMBER_9)': ")"
    '&kp LS(N9)': ")"

    '&kp LS(INT1)': "_"
    '&kp LS(INT3)': "|"

    # Mouse buttons
    '&mkp MB1': "LClick"
    '&mkp MB2': "RClick"
    '&mkp MB3': "MClick"

    # Return to base layer
    '&to 0': "L0"

  zmk_keycode_map:
    # Existing
    EXCLAMATION: "!"
    EXCL: "!"
    C_PLAY_PAUSE: "▶|⏸"

    # Japanese / English input
    LANG1: "かな"
    LANG2: "英数"

    # Modifier keys
    LEFT_SHIFT: "Shift"
    LSHIFT: "Shift"
    LSHFT: "Shift"
    RIGHT_SHIFT: "Shift"
    RSHIFT: "Shift"
    RSHFT: "Shift"

    LEFT_CONTROL: "Ctrl"
    LEFT_CTRL: "Ctrl"
    LCTRL: "Ctrl"
    RIGHT_CONTROL: "Ctrl"
    RIGHT_CTRL: "Ctrl"
    RCTRL: "Ctrl"

    LEFT_ALT: "Alt"
    LALT: "Alt"
    RIGHT_ALT: "Alt"
    RALT: "Alt"

    LEFT_GUI: "Win"
    LGUI: "Win"
    RIGHT_GUI: "Win"
    RGUI: "Win"

    # JIS symbols
    SEMI: ";"
    SEMICOLON: ";"

    COMMA: ","

    DOT: "."
    PERIOD: "."

    APOS: ":"
    APOSTROPHE: ":"

    INT1: "\\"
    SLASH: "/"

    LEFT_BRACKET: "@"
    LEFTBRACKET: "@"

    INT3: "￥"

    RIGHT_BRACKET: "["
    RIGHTBRACKET: "["

    NUHS: "]"

    # Keypad
    KP_MINUS: "-"
    KPMINUS: "-"

    KP_PLUS: "+"
    KPPLUS: "+"

    KP_MULTIPLY: "*"
    KPMULTIPLY: "*"

    KP_SLASH: "/"
    KPSLASH: "/"

    # Arrows
    UP_ARROW: "↑"
    UPARROW: "↑"

    DOWN_ARROW: "↓"
    DOWNARROW: "↓"

    LEFT_ARROW: "←"
    LEFTARROW: "←"

    RIGHT_ARROW: "→"
    RIGHTARROW: "→"

  # Modifier combinations
  # Gui+Sft+← → Win+Shift+← のように表示
  modifier_fn_map:
    left_ctrl: "Ctrl"
    right_ctrl: "Ctrl"
    left_shift: "Shift"
    right_shift: "Shift"
    left_alt: "Alt"
    right_alt: "Alt"
    left_gui: "Win"
    right_gui: "Win"
    keycode_combiner: "{mods}+{key}"
    mod_combiner: "{mod_1}+{mod_2}"

draw_config:
  dark_mode: auto
  glyph_tap_size: 18
  footer_text: 'KobitoKey KEYMAPS | Created with keymap-drawer'
